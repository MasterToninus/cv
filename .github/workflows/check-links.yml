# Reuse trusted build artifacts; link checking does not compile or change CV data.
name: Check CV PDF links

on:
  workflow_run:
    workflows: [Build CV PDFs]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful master build run ID; leave empty for the latest"
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: "1"

jobs:
  check:
    name: Check links in the four generated PDFs
    # workflow_run can receive privileged tokens: never execute PR/fork code.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the trusted checker
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install checker dependencies
        id: dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Resolve the trusted PDF artifacts
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path
          from urllib.parse import urlsplit

          from cvgen.helpers.formats import OUTPUT_STEMS

          repository = os.environ["GITHUB_REPOSITORY"]
          api_root = os.environ["GITHUB_API_URL"].rstrip("/")
          token = os.environ["GITHUB_TOKEN"]
          if api_root != "https://api.github.com":
              raise SystemExit("This workflow expects the GitHub.com API.")


          def page(url):
              location = urlsplit(url)
              if location.scheme != "https" or location.netloc != "api.github.com":
                  raise RuntimeError("Unexpected GitHub API pagination destination.")
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "CV-PDF-link-check",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                      links = response.headers.get("Link", "")
              except urllib.error.HTTPError as error:
                  raise RuntimeError(f"GitHub API request failed (HTTP {error.code}).") from None
              destinations = {
                  rel: target for target, rel in re.findall(r'<([^>]+)>;\s*rel="([^"]+)"', links)
              }
              return payload, destinations.get("next")


          def get(path):
              return page(api_root + path)[0]


          def items(path, key):
              url = api_root + path
              while url:
                  payload, url = page(url)
                  yield from payload[key]


          def is_trusted(run, workflow_id):
              return (
                  run.get("workflow_id") == workflow_id
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and run.get("event") in {"push", "workflow_dispatch"}
                  and run.get("head_branch") == "master"
                  and (run.get("repository") or {}).get("full_name") == repository
                  and (run.get("head_repository") or {}).get("full_name") == repository
              )


          try:
              workflow = get(f"/repos/{repository}/actions/workflows/build-cv.yml")
              if workflow.get("path") != ".github/workflows/build-cv.yml":
                  raise RuntimeError("The source must be the build-cv.yml workflow.")
              event = json.loads(
                  Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8")
              )
              if os.environ["GITHUB_EVENT_NAME"] == "workflow_run":
                  requested = str(event["workflow_run"]["id"])
              else:
                  requested = os.environ.get("REQUESTED_RUN_ID", "").strip()

              if requested:
                  if re.fullmatch(r"[0-9]+", requested) is None or int(requested) < 1:
                      raise RuntimeError("The run ID must be a positive integer.")
                  run = get(f"/repos/{repository}/actions/runs/{int(requested)}")
              else:
                  candidates = items(
                      f"/repos/{repository}/actions/workflows/build-cv.yml/runs"
                      "?branch=master&status=success&per_page=100",
                      "workflow_runs",
                  )
                  run = next(
                      (
                          candidate
                          for candidate in candidates
                          if is_trusted(candidate, workflow["id"])
                      ),
                      None,
                  )
                  if run is None:
                      raise RuntimeError("No successful trusted master build is available.")

              if not is_trusted(run, workflow["id"]):
                  raise RuntimeError(
                      "The source run must be a successful master build from this repository, not a PR or fork run."
                  )
              run_id = run["id"]
              sha = run["head_sha"]
              if (
                  not isinstance(run_id, int)
                  or run_id < 1
                  or re.fullmatch(r"[0-9a-f]{40}", sha) is None
              ):
                  raise RuntimeError("The source run has invalid identifiers.")

              # New runs upload raw PDFs; older runs used extensionless ZIP names.
              # Select individual documents only, never the all-PDF ZIP bundle.
              aliases = {
                  alias: stem
                  for stem in OUTPUT_STEMS.values()
                  for alias in (stem, stem + ".pdf")
              }
              selected = {stem: [] for stem in OUTPUT_STEMS.values()}
              for artifact in items(
                  f"/repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100", "artifacts"
              ):
                  stem = aliases.get(artifact["name"])
                  if stem is not None and artifact.get("expired", True) is False:
                      selected[stem].append(artifact)
              artifact_ids = []
              for name in OUTPUT_STEMS.values():
                  matches = selected[name]
                  if len(matches) != 1:
                      raise RuntimeError(
                          f"Expected one available PDF artifact for {name} or {name}.pdf."
                      )
                  identifier = matches[0]["id"]
                  if not isinstance(identifier, int) or identifier < 1:
                      raise RuntimeError("A PDF artifact has an invalid identifier.")
                  artifact_ids.append(str(identifier))

              source_url = f"https://github.com/{repository}/actions/runs/{run_id}"
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  print(f"run_id={run_id}", file=output)
                  print("artifact_ids=" + ",".join(artifact_ids), file=output)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  print(
                      f"PDF source: [build {run_id}]({source_url}), commit `{sha}`.\n",
                      file=summary,
                  )
              print(f"Selected trusted build {run_id} and all four PDF artifacts.")
          except (KeyError, OSError, RuntimeError, TypeError, ValueError) as error:
              print(f"::error::Unable to select PDF artifacts: {error}")
              sys.exit(2)
          PY

      - name: Download only the four PDF artifacts
        if: steps.source.outcome == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_ids }}
          path: gen
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Check HTTP links in the PDFs
        # Still emit an input-error report when selection or download fails.
        if: >-
          !cancelled() &&
          steps.checkout.outcome == 'success' &&
          steps.python.outcome == 'success' &&
          steps.dependencies.outcome == 'success'
        run: python -m cvgen.helpers.links --input-dir gen --report-dir gen/link-report

      - name: Publish the link-check summary
        if: ${{ always() && hashFiles('gen/link-report/links.md') != '' }}
        run: cat gen/link-report/links.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the link report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Cv-Link-Report
          path: gen/link-report/
          if-no-files-found: warn
          retention-days: 90
